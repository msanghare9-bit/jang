name: Construire l'APK et Déployer le Web

on:
  push:
    branches: [main]
    paths: ['code.b64', 'app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le paquet de code (s'il y en a un) et l'enregistrer dans le dépôt
        run: |
          if [ -f code.b64 ]; then
            tr -d ' \r\n' < code.b64 | base64 -d | tar -xz
            git rm -q code.b64
            git config user.name "jang-bot"
            git config user.email "jang-bot@users.noreply.github.com"
            git add -A app
            git commit -q -m "Mise à jour du code de l'application" && git push || true
          fi
          find app -type f -not -path '*/fonts/*' | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      - name: Préparer le projet
        working-directory: app
        run: |
          flutter --version
          flutter create . --platforms android,web --org sn.jang --project-name jang
          rm -rf test
          python3 tool/patch_android.py
          bash tool/fetch_fonts.sh
          flutter pub get
          flutter pub deps --style=compact | grep -E "firebase|cloud_firestore|youtube|shared_pref|url_launcher|webview" || true

      - name: Vérifier le code
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Construire l'APK Android
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.JANG_KEYSTORE }}
          JANG_KEYSTORE_PASSWORD: jangapk2026
          JANG_KEY_ALIAS: jang
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/jang.jks"
            export JANG_KEYSTORE_PATH="$RUNNER_TEMP/jang.jks"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Clé de signature absente : APK non publiée."
          fi
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          BUILD=${{ github.run_number }}
          sed -i "s/^const String appVersion = .*/const String appVersion = '$VERSION';/; s/^const int appBuild = .*/const int appBuild = $BUILD;/" lib/version.dart
          OPTS="--release --build-name=$VERSION --build-number=$BUILD --obfuscate --split-debug-info=$RUNNER_TEMP/symbols"
          
          flutter build apk $OPTS --split-per-abi --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/jang-64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$RUNNER_TEMP/jang-32.apk"
          
          flutter build apk $OPTS --target-platform android-arm,android-arm64,android-x64
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/jang.apk"
          ls -la "$RUNNER_TEMP"/*.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Construire la version Web (PWA)
        working-directory: app
        run: flutter build web --release

      - name: Publier les APKs dans GitHub Releases
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ env.BUILD }}
          name: Jàng ${{ env.VERSION }} (${{ env.BUILD }})
          body: Version ${{ env.VERSION }}, construction ${{ env.BUILD }}.
          files: |
            ${{ runner.temp }}/jang.apk
            ${{ runner.temp }}/jang-64.apk
            ${{ runner.temp }}/jang-32.apk
          make_latest: true

- name: Déployer la version Web sur Firebase Hosting
        run: |
          ENTRY_POINT=$(dirname $(find . -name firebase.json -not -path '*/.*' | head -n 1))
          echo "Dossier firebase.json trouve : $ENTRY_POINT"
          npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" || true
