name: jang
description: "Jàng – préparer ses examens (BFEM, Bac...)."
publish_to: 'none'
version: 1.2.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: '>=3.0.0 <100.0.0'
  firebase_auth: '>=5.0.0 <100.0.0'
  cloud_firestore: '>=5.0.0 <100.0.0'
  youtube_player_iframe: '>=5.1.0 <100.0.0'
  shared_preferences: '>=2.2.0 <100.0.0'
  url_launcher: '>=6.2.0 <100.0.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <100.0.0'

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegible-Italic.ttf
          style: italic
