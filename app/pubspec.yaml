name: jang
description: "Jàng – apprendre, leçon après leçon."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: '>=3.0.0 <100.0.0'
  firebase_auth: '>=5.0.0 <100.0.0'
  cloud_firestore: '>=5.0.0 <100.0.0'
  firebase_messaging: '>=15.0.0 <100.0.0'
  speech_to_text: '>=7.0.0 <8.0.0'
  youtube_player_iframe: '>=5.1.0 <100.0.0'
  shared_preferences: '>=2.2.0 <100.0.0'
  url_launcher: '>=6.2.0 <100.0.0'
  image_picker: '>=1.0.7 <100.0.0'
  flutter_tts: '>=3.8.5 <4.0.0'
  flutter_local_notifications: '>=17.2.2 <18.0.0'
  timezone: '>=0.9.4 <0.10.0'
  flutter_svg: '>=2.0.10 <3.0.0'
  audioplayers: '>=6.0.0 <7.0.0'
  android_alarm_manager_plus: '>=4.0.0 <5.0.0'

dev_dependencies:
  flutter_lints: '>=4.0.0 <100.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/histoires.json
    - assets/missions.json
  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic
