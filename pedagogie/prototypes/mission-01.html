/* Mise en page : un écran de téléphone centré. En haut les 6 temps de la mission,
   au milieu la scène (cour du collège, personnages), en bas le panneau d'action. */
:root {
  --bg: #f4f8fb;
  --surface: #ffffff;
  --fg: #3c3c3c;
  --muted: #6f7378;
  --line: #e3e7ea;
  --blue: #1cb0f6; --blue-d: #1899d6; --note: #ddf4ff;
  --green: #58cc02; --green-d: #58a700; --ok-bg: #d7ffb8;
  --red: #ff4b4b; --red-d: #ea2b2b; --err-bg: #ffdfe0;
  --gold: #ffc800; --gold-d: #e5a500; --warn-bg: #fff4d6;
  --violet: #8b5cf6; --violet-bg: #f1ebff;
  --sky: #cdeefd; --sand: #f3d9a4; --sand-d: #e2bf7c;
  --font-title: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --surface: #1c232a; --fg: #eef1f3; --muted: #a3acb4; --line: #2e3841;
    --note: #123247; --ok-bg: #1f3a10; --err-bg: #47191b; --warn-bg: #3e3210; --violet-bg: #2b2245;
    --sky: #1d3a52; --sand: #6b5532; --sand-d: #57442a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1c232a; --fg: #eef1f3; --muted: #a3acb4; --line: #2e3841;
  --note: #123247; --ok-bg: #1f3a10; --err-bg: #47191b; --warn-bg: #3e3210; --violet-bg: #2b2245;
  --sky: #1d3a52; --sand: #6b5532; --sand-d: #57442a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 16px 32px;
}
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1, h2, h3 { font-family: var(--font-title); margin: 0; line-height: 1.15; text-wrap: balance; }

/* En-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.top h1 { font-size: 20px; font-weight: 800; }
.top .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.why-btn { border: 2px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px;
  font: 700 13px var(--font-body); padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.why-btn[aria-pressed="true"] { border-color: var(--violet); color: var(--violet); }

.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.steps div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.steps i { display: block; height: 8px; border-radius: 4px; background: var(--line); }
.steps span { font-size: 10.5px; font-weight: 700; color: var(--muted); text-align: center; line-height: 1.1; }
.steps .done i { background: var(--green); }
.steps .now i { background: var(--blue); }
.steps .now span { color: var(--blue-d); }
.why { background: var(--violet-bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.why b { color: var(--violet); }

/* Scène */
.scene { position: relative; border-radius: 20px; overflow: hidden; background: var(--sky);
  border: 2px solid var(--line); min-height: 270px; display: flex; flex-direction: column; }
.scene .decor { position: absolute; inset: auto 0 0 0; height: 46%; background: var(--sand);
  border-top: 4px solid var(--sand-d); }
.scene .baobab { position: absolute; right: -10px; bottom: 34%; width: 120px; opacity: .55; }
.bubbles { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.cast { position: relative; z-index: 1; margin-top: auto; display: flex; justify-content: space-around; align-items: flex-end;
  padding: 0 8px 6px; min-height: 120px; }
.char { width: 104px; max-width: 30%; transition: transform .3s; }
.char svg { width: 100%; height: auto; display: block; }
.char.small { width: 80px; }
.char.peek { transform: translateX(18px) rotate(-8deg); }
.char.hop { animation: hop .6s ease-in-out infinite alternate; }
.char.sad { animation: shake .4s ease-in-out 2; }
.char.moon { animation: moon 1.6s ease-in-out infinite; }
@keyframes hop { to { transform: translateY(-10px); } }
@keyframes shake { 25% { transform: translateX(-6px) rotate(-4deg); } 75% { transform: translateX(6px) rotate(4deg); } }
@keyframes moon { 0% { transform: translateX(14px) scaleX(-1); } 50% { transform: translateX(-14px) scaleX(-1); }
  51% { transform: translateX(-14px) scaleX(1); } 100% { transform: translateX(14px) scaleX(1); } }

.bubble { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px;
  max-width: 92%; display: flex; gap: 8px; align-items: flex-start; animation: pop .25s ease-out; }
.bubble.right { align-self: flex-end; }
.bubble .who { font: 800 12px var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.bubble .en { font-weight: 800; font-size: 17px; }
.bubble .fr { font-size: 14px; color: var(--muted); font-style: italic; }
.bubble.jang { border-color: var(--violet); background: var(--violet-bg); }
.bubble.jang .who { color: var(--violet); }
.bubble.gainde { border-color: var(--gold); background: var(--warn-bg); }
.bubble.gainde .who { color: var(--gold-d); }
.bubble .txt { min-width: 0; flex: 1; }
@keyframes pop { from { transform: scale(.92); opacity: .4; } }
.say { flex: none; border: 0; background: var(--note); color: var(--blue-d); border-radius: 50%; width: 32px; height: 32px;
  cursor: pointer; font-size: 15px; }
.tr { border: 0; background: none; color: var(--blue-d); font: 700 13px var(--font-body); cursor: pointer; padding: 2px 0; }

/* Panneau d'action */
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 16px;
  display: flex; flex-direction: column; gap: 12px; }
.panel h2 { font-size: 20px; font-weight: 800; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }

.btn { font: 800 16px var(--font-body); letter-spacing: .02em; border-radius: 14px; padding: 12px 18px; cursor: pointer;
  border: 2px solid transparent; border-bottom-width: 5px; transition: transform .05s; }
.btn:active { transform: translateY(2px); border-bottom-width: 3px; }
.btn.main { background: var(--green); color: #fff; border-color: var(--green-d); width: 100%; text-transform: uppercase; }
.btn.main:disabled { background: var(--line); border-color: var(--line); color: var(--muted); cursor: default; }
.btn.soft { background: var(--surface); color: var(--violet); border-color: var(--violet); }
.btn.ghost { background: transparent; color: var(--muted); border: 2px dashed var(--line); font-size: 14px; border-bottom-width: 2px; }

.opt { text-align: left; background: var(--surface); color: var(--fg); border: 2px solid var(--line); border-bottom-width: 4px;
  border-radius: 14px; padding: 12px 14px; font: 700 16px var(--font-body); cursor: pointer; }
.opt:hover { border-color: var(--blue); }
.opt.good { background: var(--ok-bg); border-color: var(--green); }
.opt.bad { background: var(--err-bg); border-color: var(--red); }

.chip { border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); color: var(--fg);
  border-radius: 12px; padding: 8px 12px; font: 800 16px var(--font-body); cursor: pointer; }
.chip.on { background: var(--note); border-color: var(--blue); color: var(--blue-d); }
.chip:disabled { visibility: hidden; }
.slot { min-height: 54px; border-bottom: 2px solid var(--line); padding-bottom: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

input[type=text] { width: 100%; font: 700 18px var(--font-body); color: var(--fg); background: var(--bg);
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
input[type=text]:focus { outline: none; border-color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.help { border: 2px solid var(--violet); background: var(--violet-bg); border-radius: 14px; padding: 10px 12px;
  display: flex; gap: 10px; align-items: flex-start; }
.help .face { width: 44px; flex: none; }
.help .tier { font: 800 11px var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--violet); }
.help p { font-size: 15px; }
.feedback { border-radius: 14px; padding: 10px 12px; font-weight: 700; }
.feedback.ok { background: var(--ok-bg); color: var(--green-d); }
.feedback.ko { background: var(--err-bg); color: var(--red-d); }
.feedback.info { background: var(--warn-bg); }

/* Fin de mission */
.card { border-radius: 18px; padding: 16px; background: var(--note); border: 2px solid var(--blue); display: flex; gap: 12px; align-items: center; }
.card .face { width: 72px; flex: none; }
.card .big { font: 800 22px var(--font-title); }
.cando { display: flex; flex-direction: column; gap: 6px; }
.cando .lbl { font-weight: 800; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: 2px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 10px; padding: 8px 4px;
  font: 700 13px var(--font-body); cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--green); background: var(--ok-bg); }
.words { display: flex; flex-wrap: wrap; gap: 6px; }
.words span { background: var(--warn-bg); border-radius: 8px; padding: 4px 10px; font-weight: 800; }
.note { font-size: 13px; color: var(--muted); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .char.hop, .char.sad, .char.moon, .bubble { animation: none; }
}
</style>

const S = { step: 0, teach: 0, errors: 0, streak: 0, firstTry: true, name: '', bubbleCount: 0, cando: {}, skipped: false };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'")
  .replace(/[^a-z' ]/g, ' ').replace(/\s+/g, ' ').trim();

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/Gaïndé/g, 'Gaïndé'));
    u.lang = 'en-GB'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { /* pas de voix sur cet appareil */ }
}

function renderSteps() {
  $('steps').innerHTML = STEPS.map((s, i) =>
    `<div class="${i < S.step ? 'done' : i === S.step ? 'now' : ''}"><i></i><span>${s.label}</span></div>`).join('');
  $('why').innerHTML = STEPS[S.step].why;
}

function cast(list) {
  $('cast').innerHTML = list.map((c) => `<div class="char ${c.cls || ''}" data-id="${c.id}" aria-label="${NAMES[c.id]}">${CHARS[c.id]}</div>`).join('');
}
function anim(id, cls) {
  const el = document.querySelector(`.char[data-id="${id}"]`);
  if (!el) return;
  el.classList.remove('hop', 'sad', 'moon');
  void el.offsetWidth;
  if (cls) el.classList.add(cls);
}

function bubble({ who, en, fr, right, plain }) {
  const css = who === 'panthere' ? 'jang' : who === 'lion' ? 'gainde' : '';
  const id = 'b' + (S.bubbleCount++);
  const html = `<div class="bubble ${css} ${right ? 'right' : ''}">
    <div class="txt"><div class="who">${NAMES[who]}</div>
      ${plain ? `<div>${plain}</div>` : `<div class="en">${esc(en)}</div>`}
      ${fr ? `<div class="fr" id="${id}-fr" hidden>${esc(fr)}</div><button class="tr" data-tr="${id}">Voir en français</button>` : ''}
    </div>
    ${en ? `<button class="say" data-say="${esc(en)}" aria-label="Écouter">🔊</button>` : ''}
  </div>`;
  $('bubbles').insertAdjacentHTML('beforeend', html);
}
function clearBubbles() { $('bubbles').innerHTML = ''; }

document.addEventListener('click', (e) => {
  const say = e.target.closest('[data-say]');
  if (say) speak(say.dataset.say);
  const tr = e.target.closest('[data-tr]');
  if (tr) { const f = $(tr.dataset.tr + '-fr'); f.hidden = !f.hidden; tr.textContent = f.hidden ? 'Voir en français' : 'Cacher'; }
});

$('why-btn').addEventListener('click', () => {
  const w = $('why'); w.hidden = !w.hidden;
  $('why-btn').setAttribute('aria-pressed', String(!w.hidden));
});

function go(step) { S.step = step; renderSteps(); [warm, observe, understand, teach, real, keep][step](); }

/* 0. Je parle déjà anglais */
function warm() {
  clearBubbles(); cast([{ id: 'panthere', cls: 'hop' }, { id: 'lion', cls: 'small peek' }]);
  bubble({ who: 'panthere', plain: "Avant de commencer : <b>tu parles déjà anglais</b>, sans le savoir ! Touche les mots que tu connais." });
  const picked = new Set();
  $('panel').innerHTML = `<h2>Quels mots tu connais ?</h2>
    <div class="row" id="warm">${WARM_WORDS.map((w) => `<button class="chip" data-w="${w}" aria-pressed="false">${w}</button>`).join('')}</div>
    <button class="btn main" id="next">C'est tout !</button>`;
  $('warm').addEventListener('click', (e) => {
    const b = e.target.closest('[data-w]'); if (!b) return;
    const on = !picked.has(b.dataset.w);
    on ? picked.add(b.dataset.w) : picked.delete(b.dataset.w);
    b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on));
    if (on) speak(b.dataset.w);
  });
  $('next').onclick = () => {
    const n = picked.size;
    clearBubbles();
    bubble({ who: 'panthere', plain: n
      ? `Tu connais déjà <b>${n} mot${n > 1 ? 's' : ''} anglais</b> ! Tu n'es pas vide : on part de là.`
      : "Pas grave ! <b>Taxi</b>, <b>bus</b>, <b>OK</b>… tu les dis déjà en wolof et en français. Tu vois ? Tu connais déjà de l'anglais." });
    anim('panthere', 'hop');
    $('panel').innerHTML = `<p>Maintenant, regardons ce qui se passe dans la cour du collège…</p>
      <button class="btn main" id="next">On y va</button>`;
    $('next').onclick = () => go(1);
  };
}

/* 1. J'observe */
function observe() {
  clearBubbles(); cast([{ id: 'awa' }, { id: 'modou' }, { id: 'lion', cls: 'small peek' }]);
  let i = 0;
  const panel = () => {
    $('panel').innerHTML = i < SCENE.length
      ? `<h2>Écoute la scène</h2><p class="muted">Touche 🔊 pour réécouter, et « Voir en français » si tu as besoin.</p>
         <button class="btn main" id="next">${i === 0 ? 'Écouter' : 'Suite'}</button>`
      : `<p class="muted">Tu peux réécouter chaque phrase autant que tu veux.</p><button class="btn main" id="next">Continuer</button>`;
    $('next').onclick = () => {
      if (i < SCENE.length) {
        bubble(SCENE[i]); speak(SCENE[i].en); anim(SCENE[i].who, 'hop'); i++;
        if (i === SCENE.length) setTimeout(() => {
          bubble({ who: 'lion', plain: "Ils disent quoi ?? 😳 Moi aussi je veux dire mon nom…" });
          anim('lion', 'sad');
        }, 600);
        panel();
      } else go(2);
    };
  };
  panel();
}

/* 2. Je comprends */
function understand() {
  const QS = [
    { q: "Qu'est-ce qu'Awa a dit juste avant son prénom ?", opts: ['Nice to meet', 'My name is', 'Hello'], a: 1, replay: 0 },
    { q: 'Awa dit « Hello », Modou dit « Hi ». Ça veut dire quoi ?', opts: ['Au revoir', 'Merci', 'Bonjour / Salut'], a: 2, replay: 1 },
  ];
  let k = 0;
  const ask = () => {
    const Q = QS[k];
    clearBubbles(); cast([{ id: 'panthere' }, { id: 'lion', cls: 'small' }]);
    bubble({ who: 'panthere', plain: Q.q });
    $('panel').innerHTML = `<h2>Question ${k + 1} sur ${QS.length}</h2>
      <div class="col" id="opts">${Q.opts.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    $('opts').onclick = (e) => {
      const b = e.target.closest('[data-j]'); if (!b) return;
      if (+b.dataset.j === Q.a) {
        b.classList.add('good'); anim('panthere', 'hop');
        $('fb').innerHTML = `<div class="feedback ok">Oui ! Bien écouté.</div><button class="btn main" id="next" style="margin-top:12px">Continuer</button>`;
        $('opts').onclick = null;
        $('next').onclick = () => { k++; k < QS.length ? ask() : go(3); };
      } else {
        b.classList.add('bad'); b.disabled = true;
        const line = SCENE[Q.replay];
        $('fb').innerHTML = `<div class="help"><div class="face">${CHARS.panthere}</div><div>
          <div class="tier">Écoute encore</div><p>Pas tout à fait. Écoute encore ${NAMES[line.who]} :</p>
          <p><b>${esc(line.en)}</b> <button class="say" data-say="${esc(line.en)}" aria-label="Écouter">🔊</button></p></div></div>`;
        speak(line.en);
      }
    };
  };
  ask();
}

/* 3. J'enseigne à Gaïndé */
function teach() {
  S.teach = 0; S.streak = 0; startTeach();
}
function startTeach() {
  S.errors = 0; S.firstTry = true;
  const T = TEACH[S.teach];
  clearBubbles(); cast([{ id: 'lion', cls: 'hop' }, { id: 'panthere', cls: 'small' }]);
  if (S.skipped) { bubble({ who: 'panthere', plain: 'Tu vas vite ! <b>On saute une marche.</b>' }); S.skipped = false; }
  bubble({ who: 'lion', plain: esc(T.gainde) });
  const head = `<h2>Aide Gaïndé</h2><p class="muted">Marche ${S.teach + 1} sur ${TEACH.length} · ${['Choisir', 'Remettre dans l\'ordre', 'Compléter', 'Tout seul'][S.teach]}</p>`;
  const foot = `<div id="help"></div><div id="fb"></div>
    <button class="btn ghost" id="idk">Je ne sais pas encore</button>`;
  let body = '';
  if (T.kind === 'choice') {
    body = `<div class="col" id="opts">${T.options.map((o, j) => `<button class="opt" data-j="${j}">${esc(o)}</button>`).join('')}</div>`;
  } else if (T.kind === 'order') {
    body = `<div class="slot" id="slot" aria-label="Ta phrase"></div>
      <div class="row" id="pool">${T.chips.map((c, j) => `<button class="chip" data-j="${j}">${c}</button>`).join('')}</div>
      <button class="btn main" id="check" disabled>Vérifier</button>`;
  } else {
    body = `${T.kind === 'fill' ? `<p style="font-weight:800;font-size:18px">${esc(T.before)} <span style="color:var(--blue-d)">___</span> ${esc(T.after)}</p>` : ''}
      <input type="text" id="ans" autocomplete="off" placeholder="${T.kind === 'fill' ? 'Le mot qui manque' : 'Écris en anglais'}" aria-label="Ta réponse">
      <button class="btn main" id="check">Vérifier</button>`;
  }
  $('panel').innerHTML = head + body + foot;

  if (T.kind === 'choice') {
    $('opts').onclick = (e) => { const b = e.target.closest('[data-j]'); if (!b) return;
      if (+b.dataset.j === T.answer) { b.classList.add('good'); success(); } else { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 700); fail(); } };
  } else if (T.kind === 'order') {
    const seq = [];
    const upd = () => { $('slot').innerHTML = seq.map((j, p) => `<button class="chip on" data-p="${p}">${T.chips[j]}</button>`).join('');
      $('check').disabled = seq.length !== T.chips.length; };
    $('pool').onclick = (e) => { const b = e.target.closest('[data-j]'); if (!b) return; seq.push(+b.dataset.j); b.disabled = true; upd(); };
    $('slot').onclick = (e) => { const b = e.target.closest('[data-p]'); if (!b) return; const j = seq.splice(+b.dataset.p, 1)[0];
      $('pool').querySelector(`[data-j="${j}"]`).disabled = false; upd(); };
    $('check').onclick = () => { const s = norm(seq.map((j) => T.chips[j]).join(' '));
      if (s === T.answer) success(); else { fail(); seq.length = 0; $('pool').querySelectorAll('button').forEach((b) => (b.disabled = false)); upd(); } };
  } else {
    const check = () => { const v = norm($('ans').value); if (!v) return;
      const ok = T.kind === 'fill' ? T.accept.includes(v) : T.test(v);
      if (ok) success(); else { fail(); $('ans').select(); } };
    $('check').onclick = check;
    $('ans').addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
  }
  $('idk').onclick = () => { S.firstTry = false; showHelp(true); };
}
function showHelp(asked) {
  const T = TEACH[S.teach];
  S.errors = Math.min(S.errors + 1, 4);
  const h = T.hints[S.errors - 1];
  let content;
  if (typeof h === 'object') {
    const line = SCENE[h.replay];
    content = `<p>${h.text}</p><p><b>${esc(line.en)}</b> <button class="say" data-say="${esc(line.en)}" aria-label="Écouter">🔊</button></p>`;
    speak(line.en);
  } else content = `<p>${esc(h)}</p>`;
  $('help').innerHTML = `<div class="help"><div class="face">${CHARS.panthere}</div><div>
    <div class="tier">${asked && S.errors === 1 ? 'On cherche ensemble · ' : ''}${TIERS[S.errors - 1]}</div>${content}
    <p class="muted">Maintenant, à toi d'aider Gaïndé.</p></div></div>`;
  anim('panthere', 'hop');
}
function fail() {
  S.firstTry = false;
  const lines = ['Grrr… j\'ai l\'air bête là ! 😅', 'Hmm, Awa me regarde bizarrement…', 'Oups ! Tu es sûr ?', 'Aide-moi encore, s\'il te plaît !'];
  clearBubbles(); bubble({ who: 'lion', plain: lines[Math.min(S.errors, 3)] }); anim('lion', 'sad');
  showHelp(false);
}
function success() {
  const T = TEACH[S.teach];
  S.streak = S.firstTry ? S.streak + 1 : 0;
  clearBubbles();
  const said = T.kind === 'free' ? $('ans').value.trim() : T.kind === 'fill' ? 'Hello! My name is Gaïndé.' : 'My name is Gaïndé.';
  bubble({ who: 'lion', en: said, plain: null });
  speak(said); anim('lion', 'hop');
  $('help').innerHTML = '';
  $('fb').innerHTML = `<div class="feedback ok">${S.firstTry ? 'Du premier coup ! ' : 'Bravo, tu y es arrivé ! '}Gaïndé a compris grâce à toi.</div>`;
  $('idk').outerHTML = `<button class="btn main" id="next">Continuer</button>`;
  $('panel').querySelectorAll('#check, #opts button, #pool button').forEach((b) => (b.disabled = true));
  $('next').onclick = () => {
    S.teach++;
    if (S.streak >= 2 && S.teach < TEACH.length - 1) { S.teach++; S.streak = 0; S.skipped = true; }
    S.teach < TEACH.length ? startTeach() : go(4);
  };
}

/* 4. Pour de vrai */
function real() {
  let turn = 0;
  const ask = () => {
    clearBubbles();
    if (turn === 0) {
      cast([{ id: 'lion', cls: 'hop' }]);
      bubble({ who: 'lion', en: "Thank you! And you? What's your name?", fr: "Merci ! Et toi ? Comment tu t'appelles ?" });
      speak("Thank you! And you? What's your name?");
    } else {
      cast([{ id: 'awa', cls: 'hop' }, { id: 'lion', cls: 'small' }]);
      bubble({ who: 'awa', en: "Hello! My name is Awa. What's your name?", fr: "Bonjour ! Je m'appelle Awa. Comment tu t'appelles ?" });
      speak("Hello! My name is Awa. What's your name?");
    }
    $('panel').innerHTML = `<h2>${turn === 0 ? 'Réponds à Gaïndé' : 'Réponds à Awa'}</h2>
      <p class="muted">Avec ton vrai prénom, en faisant une phrase.</p>
      <input type="text" id="ans" autocomplete="off" placeholder="Écris ta réponse" aria-label="Ta réponse" value="">
      <div id="fb"></div><button class="btn main" id="check">Envoyer</button>`;
    const check = () => {
      const raw = $('ans').value.trim(); const v = norm(raw); if (!v) return;
      const m = raw.match(/(?:my\s+name\s+is|\bi\s*'?\s*a?m)\s+([^\s.!,]+)/i);
      if (m) {
        S.name = m[1].charAt(0).toUpperCase() + m[1].slice(1);
        const alt = !/my\s+name\s+is/i.test(raw);
        clearBubbles(); bubble({ who: turn === 0 ? 'lion' : 'awa', plain: turn === 0
          ? `<b>${esc(S.name)}</b> ! Quel beau prénom ! 🦁${alt ? '<br><span class="muted">(« I\'m… » marche aussi ! Awa dit plutôt « My name is… ».)</span>' : ''}`
          : null, en: turn === 1 ? `Nice to meet you, ${S.name}!` : undefined, fr: turn === 1 ? `Enchantée, ${S.name} !` : undefined });
        if (turn === 1) { speak(`Nice to meet you, ${S.name}!`); anim('lion', 'moon'); }
        $('panel').innerHTML = turn === 0
          ? `<div class="feedback ok">Tu viens de te présenter en anglais !</div><button class="btn main" id="next">Continuer</button>`
          : `<div class="feedback ok">Awa t'a compris. Tu as eu une vraie conversation en anglais ! Gaïndé fait le moonwalk.</div><button class="btn main" id="next">Terminer la mission</button>`;
        $('next').onclick = () => { turn++; turn < 2 ? ask() : go(5); };
      } else if (v.split(' ').length === 1) {
        $('fb').innerHTML = `<div class="feedback info">Presque ! Fais une phrase complète, comme Awa : « My name is… »</div>`;
      } else {
        $('fb').innerHTML = `<div class="help"><div class="face">${CHARS.panthere}</div><div><div class="tier">Un modèle</div>
          <p>Commence comme Awa : <b>My name is…</b> puis ton prénom.</p></div></div>`;
      }
    };
    $('check').onclick = check;
    $('ans').addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
  };
  ask();
}

/* 5. Je garde et je réfléchis */
function keep() {
  clearBubbles(); cast([{ id: 'lion', cls: 'moon' }, { id: 'awa' }, { id: 'panthere', cls: 'small hop' }]);
  bubble({ who: 'panthere', plain: 'Mission réussie ! Maintenant, <b>c\'est toi qui juges</b> ce que tu sais faire.' });
  const name = S.name || 'Fatou';
  $('panel').innerHTML = `
    <h2>Ma carte de présentation</h2>
    <div class="card"><div class="face">${CHARS.lion}</div><div><div class="big">Hello! My name is ${esc(name)}.</div>
      <div class="muted">Mission 1 · présentée à Gaïndé et Awa</div></div></div>
    <h2>Mes « Je sais… »</h2>
    <div class="col" id="cando">${CANDO.map((c, i) => `<div class="cando"><div class="lbl">${esc(c)}</div>
      <div class="seg" data-i="${i}">${['Pas encore', "Avec de l'aide", 'Tout seul'].map((l) => `<button aria-pressed="false">${l}</button>`).join('')}</div></div>`).join('')}</div>
    <h2>Qu'est-ce qui était difficile ?</h2>
    <div class="row" id="hard">${['Comprendre la scène', "L'ordre des mots", 'Écrire seul', 'Rien !'].map((l) => `<button class="chip">${l}</button>`).join('')}</div>
    <div id="hardfb"></div>
    <h2>Mon carnet de mots</h2>
    <div class="words">${CARNET.map((w) => `<span>${esc(w)}</span>`).join('')}</div>
    <button class="btn soft" id="again">Rejouer la mission</button>`;
  $('cando').onclick = (e) => { const b = e.target.closest('.seg button'); if (!b) return;
    b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); };
  const replies = {
    'Comprendre la scène': "C'est normal au début. Tu as eu le droit de réécouter : c'est comme ça qu'on apprend.",
    "L'ordre des mots": "En anglais, l'ordre des mots est très important. On va le retrouver dans la prochaine mission.",
    'Écrire seul': "Écrire seul, c'est le plus dur. Et tu l'as fait ! La prochaine fois, ce sera plus facile.",
    'Rien !': 'Super ! La prochaine mission sera un peu plus difficile, alors. 😉',
  };
  $('hard').onclick = (e) => { const b = e.target.closest('.chip'); if (!b) return;
    $('hard').querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b));
    $('hardfb').innerHTML = `<div class="help"><div class="face">${CHARS.panthere}</div><div><p>${esc(replies[b.textContent])}</p></div></div>`; };
  $('again').onclick = () => { Object.assign(S, { name: '', streak: 0 }); go(0); };
}

go(0);
</script>
